[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumscope"
version = "0.6.2"
description = "Cross-platform, scientifically grounded quantum visualization studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "QuantumScope contributors"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.11", "pyqtgraph>=0.13", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
quantumscope = "quantumscope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
quantumscope = ["assets/*.png", "assets/*.svg", "assets/*.ico", "learn/content/*/*.md", "learn/content/eq/*.png"]
