name: Build downloadable applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} executable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            executable: QuantumScope.exe
          - os: ubuntu-24.04
            label: Linux
            executable: QuantumScope
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System graphics libraries (Linux build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0
      - name: Install dependencies and bundler
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pyinstaller
      - name: Physics tests
        run: python -m pytest -q
      - name: Build executable directory
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name QuantumScope --collect-submodules vtkmodules --collect-data vtkmodules --collect-all pyvista --collect-all pyqtgraph --collect-all pyvistaqt src/quantumscope/__main__.py
      - name: Create downloadable ZIP
        shell: python
        env:
          PLATFORM: ${{ matrix.label }}
        run: |
          import os, pathlib, zipfile
          source = pathlib.Path('dist/QuantumScope')
          label = os.environ['PLATFORM']
          target = pathlib.Path(f'QuantumScope-v0.1.3-{label}.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in source.rglob('*'):
                  if file.is_file():
                      archive.write(file, pathlib.Path('QuantumScope') / file.relative_to(source))
              if label == 'Linux':
                  archive.writestr('RUN_ON_LINUX.txt', 'Extract the ZIP; run chmod +x QuantumScope/QuantumScope && ./QuantumScope/QuantumScope.\nFor NVIDIA PRIME graphics on Ubuntu, launch using the included run_packaged_nvidia.sh from the extracted root.\n')
              else:
                  archive.writestr('RUN_ON_WINDOWS.txt', 'Extract the ZIP and double-click QuantumScope/QuantumScope.exe.\n')
              if label == 'Linux':
                  archive.write('run_packaged_nvidia.sh', 'run_packaged_nvidia.sh')
          print(target)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumScope-v0.1.3-${{ matrix.label }}
          path: QuantumScope-v0.1.3-${{ matrix.label }}.zip
          if-no-files-found: error
      - name: Attach ZIP to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" || gh release create "${GITHUB_REF_NAME}" --title "QuantumScope ${GITHUB_REF_NAME}" --notes "Cross-platform preview build. See README for requirements and known limitations."
          gh release upload "${GITHUB_REF_NAME}" "QuantumScope-v0.1.3-${{ matrix.label }}.zip" --clobber
