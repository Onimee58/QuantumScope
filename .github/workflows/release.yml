name: Build installable QuantumScope releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pyinstaller
      - name: Physics regression tests
        run: python -m pytest -q
      - name: Build standalone application with icon
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          ICON="src/quantumscope/assets/quantumscope.png"
          if [ "$TARGET" = windows ]; then ICON="src/quantumscope/assets/quantumscope.ico"; fi
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name QuantumScope --icon "$ICON" --collect-submodules vtkmodules --collect-data vtkmodules --collect-data pyvista --collect-data pyqtgraph --collect-data pyvistaqt --collect-data quantumscope --exclude-module pyqtgraph.examples --exclude-module pyqtgraph.opengl --exclude-module pyvista.trame src/quantumscope/__main__.py
      - name: Build Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build_deb.sh 0.2.0
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows setup wizard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          & $compiler /DMyAppVersion=0.2.0 packaging\QuantumScope.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuantumScope-0.2.0-${{ matrix.platform }}-installer
          path: dist/installers/*
          if-no-files-found: error
      - name: Publish installers with tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "QuantumScope $GITHUB_REF_NAME" --notes "Native Windows and Ubuntu installers; test on target systems."
          gh release upload "$GITHUB_REF_NAME" dist/installers/* --clobber
